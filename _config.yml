# Hexo Configuration

# Site
title: '@chaoming.edc blog'
subtitle:
description: track my learning
keywords:
author: chaoming.edc|blastmann
language: zh-CN

# URL
url: https://blastmann.github.io/
root: /
permalink: post/:title.html
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

# Writing
new_post_name: ':year-:month-:day-:title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Archives / Category / Tag 页面：旧博客已归档，全部关闭
archive: 0
category: 0
tag: 0

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: hexo-theme-iOS7

feed:
  type: atom
  path: atom.xml
  limit: 20

sitemap:
  path: sitemap.xml

# Deployment
deploy:
  type: git
  repository: git@github.com:blastmann/blastmann.github.io.git
  branch: master
